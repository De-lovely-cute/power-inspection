function togglePlay(){if(!state.validated){toast('请先运行当前版本的演示校验');return}state.playing=!state.playing;if(state.playing){if(state.progress>=100)state.progress=0;playbackTimer=setInterval(function(){const speed=Number((document.getElementById('play-speed')?.value||'1').replace('×',''));state.progress=Math.min(100,state.progress+.3*speed);updatePlayback();if(state.progress>=100){clearInterval(playbackTimer);playbackTimer=null;state.playing=false;const btn=document.getElementById('play-control');if(btn)btn.textContent='▶'}},120)}else{clearInterval(playbackTimer);playbackTimer=null}document.getElementById('play-control').textContent=state.playing?'Ⅱ':'▶';}
// 展示新建巡检任务的侧栏表单。
function newTaskDrawer(reinspection=false){const reTower=photoMeta[state.selectedImage].tower;document.getElementById('modal').innerHTML=`<div class="overlay"><section class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"><div class="drawerhead"><div><p class="eyebrow">INSPECTION TASK</p><h2 id="drawer-title">${reinspection?'创建复检任务':'新建巡检任务'}</h2></div><button class="btn small" data-action="close-modal" aria-label="关闭">×</button></div><form id="task-form" data-reinspection="${reinspection}" style="display:contents"><div class="drawerbody"><div class="sectionlabel">基本信息</div><label class="formlabel" for="task-name">任务名称 *</label><input class="field full" id="task-name" required maxlength="80" value="${reinspection?'T0'+reTower+' 左侧绝缘子复检':''}" placeholder="请输入任务名称"><label class="formlabel" for="task-type">任务类型</label><select class="field full" id="task-type"><option>${reinspection?'缺陷复检':'精细化巡检'}</option><option>通道巡视</option></select><div class="spacer"></div><div class="sectionlabel">巡检范围</div><label class="formlabel">三维场景</label><select class="field full" aria-label="三维场景"><option>示范线路 A / G4</option></select><label class="formlabel">巡检杆塔 *</label><div class="checkboxchips">${[1,2,3,4,5].map(function(n){return `<label><input name="towers" type="checkbox" value="${n}" ${!reinspection||n===reTower?'checked':''}> T0${n}</label>`}).join('')}</div><label class="formlabel">巡检目标</label><div class="miniinfo">${reinspection?'T0'+reTower+' 左侧绝缘子串 · 已人工确认需复检':'按所选杆塔加载已配置目标，创建时保存任务配置快照。'}</div><div class="spacer"></div><div class="sectionlabel">飞行参数</div><label class="formlabel">起降点</label><select class="field full" aria-label="起降点"><option>起降点 A</option></select><div class="formrow"><div><label class="formlabel">巡航速度 / m·s⁻¹</label><input type="number" class="field full" id="task-speed" min="1" max="15" value="5" required aria-label="任务巡航速度"></div><div><label class="formlabel">时间预算 / min</label><input type="number" class="field full" id="task-budget" min="1" max="120" value="20" required aria-label="任务时间预算"></div></div><label class="checkline"><input type="checkbox" checked> 包含返航航段</label><div class="safetytext">当前表单保存为浏览器会话内演示数据，任务创建后可进入规划页面。</div></div><div class="drawerfoot"><button type="button" class="btn" data-action="close-modal">取消</button><button type="submit" class="btn primary">创建演示任务</button></div></form></section></div>`;document.getElementById('task-name').focus();}
// 展示巡检目标的配置侧栏并提示保存后需要重新校验。
function targetDrawer(){document.getElementById('modal').innerHTML=`<div class="overlay"><section class="drawer" role="dialog" aria-modal="true" aria-labelledby="target-title"><div class="drawerhead"><div><p class="eyebrow">INSPECTION TARGET</p><h2 id="target-title">配置巡检目标</h2></div><button class="btn small" data-action="close-modal" aria-label="关闭">×</button></div><div class="drawerbody"><div class="sectionlabel">设备与目标</div><label class="formlabel">所属杆塔</label><input class="field full" readonly value="T0${state.selectedTower} / tower_00${state.selectedTower}" aria-label="所属杆塔"><label class="formlabel">目标名称</label><input class="field full" value="左侧绝缘子串" aria-label="目标名称"><label class="formlabel">目标三维坐标 / ENU · m</label><div class="formrow"><input class="field" type="number" value="326.4" aria-label="目标坐标x"><input class="field" type="number" value="215.8" aria-label="目标坐标y"></div><input class="field full" style="margin-top:10px" type="number" value="32.0" aria-label="目标坐标z"><div class="spacer"></div><div class="sectionlabel">拍摄要求</div><label class="checkline"><input type="checkbox" checked> 正面拍摄</label><label class="checkline"><input type="checkbox" checked> 侧面拍摄</label><label class="formlabel">拍摄距离范围 / m · 演示参数</label><div class="formrow"><input class="field" value="10" type="number" aria-label="最小拍摄距离"><input class="field" value="18" type="number" aria-label="最大拍摄距离"></div><label class="formlabel">目标优先级</label><select class="field full" aria-label="目标优先级"><option>常规</option><option>优先</option></select><div class="alert neutral" style="margin-top:20px">目标由三维模型人工标记，图片检测框不直接作为三维坐标。</div></div><div class="drawerfoot"><button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="save-target">保存演示配置</button></div></section></div>`;}
// 将演示数据下载为文件，供用户查看原型导出格式。
function downloadFile(name,data,type='application/json'){const blob=new Blob([data],{type});const url=URL.createObjectURL(blob);const anchor=document.createElement('a');anchor.href=url;anchor.download=name;anchor.click();setTimeout(function(){URL.revokeObjectURL(url)},1000);toast('已导出演示数据');}
// 创建展示任务详情或成果快照的只读侧栏。
function detailDrawer(title,body){document.getElementById('modal').innerHTML=`<div class="overlay"><section class="drawer" role="dialog" aria-modal="true" aria-labelledby="detail-title"><div class="drawerhead"><h2 id="detail-title">${title}</h2><button class="btn small" data-action="close-modal" aria-label="关闭">×</button></div><div class="drawerbody">${body}</div><div class="drawerfoot"><button class="btn primary" data-action="close-modal">关闭</button></div></section></div>`;}
// 统一处理原型页面按钮，并保证路线编辑后撤销旧校验状态。
function handleClick(event){const nav=event.target.closest('[data-nav]');if(nav){navigate(nav.dataset.nav);return}const control=event.target.closest('[data-action]');if(!control)return;const action=control.dataset.action;switch(action){case'tower':state.selectedTower=Number(control.dataset.value);render();break;case'new-task':newTaskDrawer();break;case'close-modal':document.getElementById('modal').innerHTML='';break;case'edit-target':targetDrawer();break;case'save-target':state.validated=false;document.getElementById('modal').innerHTML='';toast('目标配置已保存为演示状态，需重新生成并校验航线');render();break;case'task-filter':state.taskFilter=control.dataset.value;render();break;case'generate':state.routeRevision++;state.validated=false;render();toast('已加载预置航线 R'+state.routeRevision+'，请发起校验');break;case'edit-waypoint':state.routeRevision++;state.validated=false;render();toast('航点演示修改已保存，原校验报告失效');break;case'validate':state.validated=true;state.page='simulation';navigate('simulation');toast('当前 R'+state.routeRevision+' / G4 演示校验通过');break;case'play':togglePlay();break;case'reset-play':state.progress=0;updatePlayback();break;case'select-waypoint':document.querySelectorAll('.waypoint').forEach(function(el){el.classList.remove('active')});control.classList.add('active');toast('已选中 WP'+String(Number(control.dataset.value)+1).padStart(2,'0')+' · 演示编辑面板');break;case'toggle-zone':state.layers.zone=!state.layers.zone;render();break;case'toggle-route':state.layers.route=!state.layers.route;render();break;case'map-reset':toast('已回到演示场景默认视角');break;case'select-image':state.selectedImage=Number(control.dataset.value);render();break;case'image-next':state.selectedImage=(state.selectedImage+1)%imageNames.length;render();break;case'image-prev':state.selectedImage=(state.selectedImage+3)%imageNames.length;render();break;case'ai-run':toast('已展示预置识别结果，未调用真实 AI 服务');break;case'review-confirm':photoMeta[state.selectedImage].review='confirmed';render();toast('已记录演示复核结论：需要复检');break;case'review-reject':photoMeta[state.selectedImage].review='rejected';render();toast('已记录演示复核结论：驳回');break;case'review-uncertain':photoMeta[state.selectedImage].review='uncertain';render();toast('已记录演示复核结论：无法判断');break;case'reinspect':newTaskDrawer(true);break;case'upload-image':detailDrawer('导入巡检图片','<div class="alert neutral">当前原型使用预置合成图展示识别流程。</div><div class="spacer"></div><div class="tiny">实际开发接口：上传文件 → 创建照片记录并绑定任务、杆塔及航点 → 提交异步识别作业。详见随附接口文档。</div>');break;case'open-task':{const t=[...state.newTasks,...taskRows].find(function(x){return x.id===control.dataset.value});detailDrawer('巡检任务详情',`<div class="sectionlabel">${esc(t.name)}</div><div class="datarow">任务编号<b>${t.id}</b></div><div class="datarow">巡检范围<b>${t.towers} 基杆塔 / ${t.targets} 个目标</b></div><div class="datarow">任务状态<b>${t.status}</b></div><div class="datarow">创建时间<b>${t.date}</b></div><div class="spacer"></div><div class="miniinfo">演示任务详情。实际规划以任务配置快照、场景和航线版本为准。</div>`);break;}case'report-detail':detailDrawer('历史巡检成果','<div class="sectionlabel">示范线路 A · 历史任务快照</div><div class="datarow">计划目标<b>12 个</b></div><div class="datarow">有效覆盖<b>12 / 12</b></div><div class="datarow">规划航程<b>2.10 km</b></div><div class="datarow">报告版本<b>R2 / G4</b></div><div class="spacer"></div><div class="miniinfo">历史成果为演示数据，不随当前任务编辑变化。</div>');break;case'export-route':downloadFile('demo-route.json',JSON.stringify({demo:true,route_id:'route_001',revision:state.routeRevision,geometry_revision:4,frame:'ENU',unit:'m',validation_status:state.validated?'valid':'not_validated',notice:'示意数据，不可直接用于实机飞行',waypoints:[{id:'wp_001',position:{x:0,y:0,z:35},action:'takeoff'},{id:'wp_005',position:{x:326.4,y:215.8,z:46},target_id:'target_003_1',action:'capture'}]},null,2));break;case'export-tasks':downloadFile('demo-tasks.json',JSON.stringify({demo:true,tasks:[...state.newTasks,...taskRows]},null,2));break;case'export-assets':downloadFile('demo-targets.json',JSON.stringify({demo:true,frame:'ENU',geometry_revision:4,targets:['target_003_1','target_003_2']},null,2));break;case'export-report':downloadFile('demo-report.csv','\uFEFF任务名称,航程km,有效覆盖,场景版本,备注\r\n例行巡检,2.10,12/12,G4,演示数据\r\n通道巡视,2.18,8/8,G3,演示数据\r\n','text/csv;charset=utf-8');break;}}
// 处理带必填校验的任务创建，在当前浏览器会话中加入任务记录。
function handleSubmit(event){if(event.target.id!=='task-form')return;event.preventDefault();const towers=[...document.querySelectorAll('input[name="towers"]:checked')];if(!towers.length){toast('请至少选择一基杆塔');return}const name=document.getElementById('task-name').value.trim();if(!name){toast('请输入任务名称');return}state.newTasks.unshift({id:'task_demo_'+String(state.newTasks.length+1).padStart(3,'0'),name,towers:towers.length,targets:event.target.dataset.reinspection==='true'?1:towers.reduce(function(total,item){return total+(Number(item.value)===3?4:2)},0),status:'draft',date:'2026-11-05 10:30',owner:'李工'});state.taskFilter='all';state.taskSearch='';document.getElementById('modal').innerHTML='';navigate('tasks');toast('演示任务已创建，配置待接入后端保存');}
// 处理搜索、图层和时间轴控件，并恢复重绘后的搜索焦点。
function handleInput(event){const el=event.target;if(el.id==='review-note')photoMeta[state.selectedImage].note=el.value;if(el.id==='timeline'){state.progress=Number(el.value);updatePlayback()}if(el.id==='task-search'||el.id==='asset-search'){const key=el.id==='task-search'?'taskSearch':'assetSearch';const pos=el.selectionStart;state[key]=el.value;render();const next=document.getElementById(el.id);next.focus();next.setSelectionRange(pos,pos)}if(el.dataset.layer){state.layers[el.dataset.layer]=el.checked;render()}}
// 注册原型交互与键盘关闭行为，并读取可分享的页面标识。
document.addEventListener('click',handleClick);document.addEventListener('submit',handleSubmit);document.addEventListener('input',handleInput);document.addEventListener('keydown',function(event){if(event.key==='Escape')document.getElementById('modal').innerHTML=''});window.addEventListener('hashchange',function(){if(location.hash.slice(1)!==state.page)navigate(location.hash.slice(1))});navigate(location.hash.slice(1)||'overview');
</script>
