[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.0",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "scipy>=1.18.1",
    "sqlalchemy>=2.1.8",
    "ultralytics>=8.4.202",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
